name = "tap-join"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Public sign-up pages live at join.techsorted.nz (custom domain set in the dashboard,
# see README). The admin page (/admin) is behind Cloudflare Access.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "tap-join"
database_id = "664bcb71-bddb-44d1-9513-76ef14da454f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AGREEMENTS"
bucket_name = "tap-agreements"

# Pages, terms and the PDF template/fonts are bundled into the Worker.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.pdf", "**/*.ttf"]
fallthrough = true

# Not secret. Secrets (TURNSTILE_SECRET, SMTP2GO_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
# are set in the Worker's settings in the Cloudflare dashboard, never in this file.
[vars]
PUBLIC_ORIGIN = "https://join.techsorted.nz"
TURNSTILE_SITEKEY = "0x4AAAAAAFltpbJR-I-H1Lwk"   # shared "Tap Contact Form Human Check" widget
MAIL_FROM = "tap by techsorted <shaun@techsorted.nz>"
NOTIFY_EMAIL = "shaun@techsorted.nz"
COUNTERSIGN_NAME = "Shaun"
INVITE_DAYS = "14"
# Cloudflare Access for /admin (the "tap-join admin" Access app). If either is empty, /admin is closed.
ACCESS_TEAM_DOMAIN = "techsortednz.cloudflareaccess.com"
ACCESS_AUD = "67789877b5785e9f15f8b99d0f998ae11b0b2efa0f3afe0d07bbe73326c27f32"
