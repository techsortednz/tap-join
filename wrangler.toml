name = "tap-join"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Public sign-up pages live at jointap.techsorted.nz (custom domain set in the dashboard,
# see README). Admin lives on the hub (hub.techsorted.nz), behind Cloudflare Access.
workers_dev = false
preview_urls = false

# jointap.techsorted.nz: customer sign-up pages. hub.techsorted.nz: Shaun's private hub
# (everything except /stats*, which goes to the tap-stats Worker).
routes = [
  { pattern = "jointap.techsorted.nz", custom_domain = true },
  { pattern = "hub.techsorted.nz/*", zone_name = "techsorted.nz" },
]

# Logs in the dashboard (Workers > tap-join > Logs): email results, errors, timings.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "tap-join"
database_id = "664bcb71-bddb-44d1-9513-76ef14da454f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AGREEMENTS"
bucket_name = "tap-agreements"

# Pages, terms and the PDF template/fonts are bundled into the Worker.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.pdf", "**/*.ttf"]
fallthrough = true

# Not secret. Secrets (TURNSTILE_SECRET, SMTP2GO_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
# are set in the Worker's settings in the Cloudflare dashboard, never in this file.
[vars]
PUBLIC_ORIGIN = "https://jointap.techsorted.nz"
HUB_HOST = "hub.techsorted.nz"
TURNSTILE_SITEKEY = "0x4AAAAAAFltpbJR-I-H1Lwk"   # shared "Tap Contact Form Human Check" widget
MAIL_FROM = "Shaun at tap by techsorted <shaun@techsorted.nz>"
REPLY_TO = "shaun@techsorted.nz"
COUNTERSIGN_NAME = "Shaun"
INVITE_DAYS = "14"
# Cloudflare Access for hub.techsorted.nz (the "techsorted hub" Access app). If either is empty, the hub is closed.
ACCESS_TEAM_DOMAIN = "techsortednz.cloudflareaccess.com"
ACCESS_AUD = "c8c55d7ab43fb0a380186aea39805d63733abb3eabe9ab929032bea3c01e14e1"  # techsorted hub app
